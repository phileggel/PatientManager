name: Review

# The reviewers of `app@daneel`, checked out at the pinned tag (DANEEL_REF), run on
# every pull request, one job per lane the diff touches (the plugin's
# review-lanes.sh, with the base branch's .claude/daneel.json). Each posts its report
# as a lane comment and fails the check on any 🔴 critical. Runs on the owner's Claude
# subscription through the CLAUDE_CODE_OAUTH_TOKEN repository secret (minted
# with `claude setup-token`); the check fails closed without it rather than
# reporting a review that did not happen. Dependabot PRs get no repository
# secrets: their lanes are skipped, every other check still gates them. PRs
# from forks get no secrets either: their lanes fail closed, and the owner
# decides whether the contribution is reviewed and taken over on a branch here.

on:
  pull_request:
    branches: [main]
    # `closed` (FLOW-056): its run joins this concurrency group and cancels the rounds
    # still running on a pull request closed or merged; its own jobs skip.
    types: [opened, synchronize, reopened, closed]
  # Re-run by hand on an open pull request when GitHub drops the event
  # (`gh workflow run Review --ref <branch> -f pr=<number>`).
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true

concurrency:
  # Per pull request, so manual re-runs of two PRs never cancel each other.
  group: review-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read

# reviewer-infra FP (CI, PR #121): a `pull_request` workflow runs its own YAML
# from the PR by GitHub's design. `pull_request_target` (base YAML) would hand
# the secrets to fork code — worse. Write access is the boundary: whoever can
# push a branch here can change any workflow; the merge guard and the owner's
# release are the gates against that.

env:
  # Any 🔴 fails the check. Set to "false" only to bootstrap prompts that the
  # reviewers on main do not know yet (as PR #121 did), then set it back to
  # "true" in the next PR.
  REVIEW_BLOCKING: "true"
  # The daneel release the reviewers, their protocol and helpers come from. A pull
  # request moves it; the prompts of that pull request's own review are then the new ones.
  DANEEL_REF: app--v0.1.1

jobs:
  lanes:
    name: Lanes touched by the diff
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      lanes: ${{ steps.detect.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # reviewer-infra FP (CI run on PR #121): both actions really are v7.0.1 —
      # checked with `git ls-remote --tags` on 2026-09-27; newer than its training data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: phileggel/daneel
          ref: ${{ env.DANEEL_REF }}
          path: .daneel
          persist-credentials: false
      - name: Map changed files to reviewer lanes
        # The lane map is the pinned release's and its settings the base branch's, so a
        # pull request cannot switch its own reviewers off.
        id: detect
        shell: bash
        env:
          BASE: ${{ github.base_ref || 'main' }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [[ "$ACTOR" == "dependabot[bot]" ]]; then
            lanes='{}'  # a missing lane reads as false: every lane skipped
          else
            git show "origin/$BASE:.claude/daneel.json" > .claude/daneel.json
            lanes=$(git diff --name-only "origin/$BASE...HEAD" | bash .daneel/plugins/app/scripts/review-lanes.sh --json)
          fi
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"
          echo "$lanes"

  review:
    name: reviewer-${{ matrix.reviewer }}
    needs: lanes
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Two tries of a reviewer at worst (about 5 minutes each at 60 turns), with headroom.
    timeout-minutes: 40
    permissions:
      contents: read
      # The report is a lane comment on the pull request.
      pull-requests: write
    env:
      # Where the pinned action writes the session's execution log (verified
      # against v1 @ 9cdae7f in folioneer; re-check when the pin moves).
      SESSION_LOG: /home/runner/work/_temp/claude-execution-output.json
      # What both tries of a reviewer are given (the second runs only when the
      # first wrote no report).
      REVIEW_PROMPT: |
        You are the `${{ matrix.agent }}` reviewer of this repository.
        Read `.daneel/plugins/app/agents/${{ matrix.agent }}.md` and follow it
        exactly, in its default diff-scoped mode, against the current branch
        (the pull request's merge commit; `bash .daneel/plugins/app/scripts/branch.sh
        files` and `bash .daneel/plugins/app/scripts/branch.sh diff <path> [<path> ...]`
        give the changed set and the whole diff in one call).
        `${CLAUDE_PLUGIN_ROOT}` in it is `.daneel/plugins/app`.
        The working directory's `CLAUDE.md` and `.claude/` are the base branch's,
        `.daneel/` is the pinned release: your instructions, not what you review. Read, grep
        and glob the pull request's files, and the documents you check them
        against, in `/home/runner/work/_temp/branch/`: the branch's tree as
        pushed, the same paths; where a prompt says `git show HEAD:<path>`, read the
        file there. Nobody answers a question here: a prompt that wants a document to
        review gets every file of its lane `branch.sh files` lists.
        Include `docs/ubiquitous-language.md` in your term checks. Save the
        full report where the protocol says (`bash .daneel/plugins/app/scripts/review-path.sh
        ${{ matrix.agent }}`). Do not post comments or reviews
        on GitHub yourself; the workflow does that from the saved file.
        Be concise: one line per finding (location, claim, fix); no
        restating of the diff, no narrative, no unrequested alternatives.
      # 60 turns: an 11-file infra diff needed 48 (#139, 4.5 min); the job timeout keeps ample headroom.
      REVIEW_ARGS: |
        --model claude-sonnet-5
        --max-turns 60
        --allowedTools "Read" "Grep" "Glob" "Edit(.review/**)" "Bash(bash .daneel/plugins/app/scripts/branch.sh *)" "Bash(bash .daneel/plugins/app/scripts/review-path.sh *)" "Bash(git status)" "Bash(git cat-file *)" "Bash(git rev-parse *)" "Bash(git ls-files)" "Bash(git ls-files *)" "Bash(grep *)" "Bash(ls *)" "Bash(wc *)" "Bash(shellcheck *)"
        --disallowedTools "WebFetch" "WebSearch" "Skill"
        --add-dir /home/runner/work/_temp/branch
    strategy:
      fail-fast: false
      matrix:
        include:
          - { reviewer: backend, agent: reviewer-backend }
          - { reviewer: arch, agent: reviewer-arch }
          - { reviewer: frontend, agent: reviewer-frontend }
          - { reviewer: sql, agent: reviewer-sql }
          - { reviewer: infra, agent: reviewer-infra }
          - { reviewer: security, agent: reviewer-security }
          - { reviewer: e2e, agent: reviewer-e2e }
          - { reviewer: guides, agent: reviewer-guides }
          - { reviewer: spec, agent: spec-reviewer }
          - { reviewer: contract, agent: contract-reviewer }
          - { reviewer: adr, agent: adr-reviewer }
    steps:
      - name: Skip lanes the diff does not touch
        id: gate
        shell: bash
        env:
          LANES: ${{ needs.lanes.outputs.lanes }}
          REVIEWER: ${{ matrix.reviewer }}
        run: |
          set -euo pipefail
          if [[ "$(jq -r --arg r "$REVIEWER" '.[$r]' <<<"$LANES")" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reviewer-$REVIEWER: no file in its lane changed"
          fi

      - name: Require the subscription token
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set on the repository (mint one with \`claude setup-token\`, store it with \`gh secret set CLAUDE_CODE_OAUTH_TOKEN\`) — the reviewer cannot run, and a review that did not happen must not pass."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0
          # The session reads untrusted diff content: no job token may sit in
          # .git/config for it to read (the redaction below does not match the
          # checkout's AUTHORIZATION header shape).
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          repository: phileggel/daneel
          ref: ${{ env.DANEEL_REF }}
          path: .daneel
          persist-credentials: false

      - name: Give the branch helper a local main, the base branch's settings, and the branch's tree
        id: trusted
        # The plugin's branch.sh resolves the diff base as merge-base(HEAD, main), and
        # lists untracked files: `.daneel/` is kept out of what it reports. The reviewer
        # prompts and helpers come from the pinned release, their settings from the base
        # branch, so a PR can neither soften the criteria that grade it nor change what
        # the reviewer runs; a PR that edits them still has that edit in its diff.
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git branch -f main "origin/$BASE"
          echo ".daneel/" >> .git/info/exclude
          # The branch's tree as pushed, for the session to read (ticket #490): this
          # step, and the action itself (restore-config.ts at v1.0.251), put the
          # base branch's prompts and settings over the pull request's in the workspace.
          # Its `.claude/skills/` may load as the session's skills: the `Skill` tool is refused.
          git worktree add --detach /home/runner/work/_temp/branch HEAD
          # The helpers run beside a token (last step): the base branch's copy, or
          # none at all on the pull request that adds it.
          for helper in scripts/review-stop-reason.py scripts/review-criticals.py; do
            if git cat-file -e "origin/$BASE:$helper" 2>/dev/null; then
              git checkout "origin/$BASE" -- "$helper"
            else
              rm -f "$helper"
            fi
          done
          # The session's settings and hooks are the base branch's too: the pinned
          # action loads the checked-out project's settings (setting sources user,
          # project, local in base-action/src/parse-sdk-options.ts at v1.0.251) and
          # Claude Code runs the hooks they name, beside the subscription token. A
          # hook the pull request adds is removed; the log says what then differs. The
          # plugin's lanes read their rules list from `.claude/daneel.json`.
          for path in .claude/settings.json .claude/hooks .claude/daneel.json .claude/agents; do
            rm -rf "$path"
            if git cat-file -e "origin/$BASE:$path" 2>/dev/null; then
              git checkout "origin/$BASE" -- "$path"
            fi
          done
          git status --short .claude

      - name: Run the reviewer prompt
        # The session reads a diff nobody has reviewed yet, so its shell is a
        # list of named commands, not `Bash` minus a refused list: the two
        # trusted helpers (they give the diff and the log), three git reads,
        # grep, ls, wc and shellcheck. None runs code from the pull request,
        # reaches the network or writes a file: `git diff|log|show` are left
        # out because their `--output` option writes anywhere. A reviewer
        # that needs another command is refused it visibly; extend the list
        # on purpose. Nothing leaves the runner except the report and the
        # session log, both redacted below first.
        # Said outright, though an `if:` without a status function already implies
        # success(): no session without the base branch's prompts and helpers.
        if: steps.gate.outputs.run == 'true' && steps.trusted.outcome == 'success'
        # A first try that fails or writes nothing is tried once more below; the
        # last step fails the job when there is still no report.
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6  # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token is enough: the session gets no GitHub tool.
          # reviewer-infra FP (CI, PR #121): with a custom prompt the action posts
          # nothing itself — two runs left only the step below's lane comment.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.REVIEW_ARGS }}

      - name: Say why the first try wrote no report
        # A reviewer sometimes ends with nothing written and no cause in the log
        # (FLOW-008). The reason is printed from named fields only: the session
        # log is not redacted yet (scripts/review-stop-reason.py, the base branch's
        # copy). A first try that crashed after writing its report is not retried:
        # the report is what counts.
        # Only after the trusted helpers are in place: a failed setup step is not
        # retried, and never lets the pull request's copy of a helper run.
        id: retry
        if: ${{ steps.gate.outputs.run == 'true' && steps.trusted.outcome == 'success' && !cancelled() }}
        shell: bash
        env:
          AGENT: ${{ matrix.agent }}
          REVIEWER: ${{ matrix.reviewer }}
        run: |
          set -euo pipefail
          if compgen -G ".review/$AGENT-*.md" > /dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            why=$(python3 -I scripts/review-stop-reason.py "$SESSION_LOG" 2>/dev/null || echo "the stop reason is unavailable")
            echo "::warning::reviewer-$REVIEWER wrote no report on its first try: $why. Trying once more."
          fi

      - name: Run the reviewer prompt again
        if: ${{ steps.gate.outputs.run == 'true' && steps.retry.outputs.needed == 'true' && !cancelled() }}
        # Like the first try: the last step decides, from the report.
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6  # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token is enough: the session gets no GitHub tool.
          # reviewer-infra FP (CI, PR #121): with a custom prompt the action posts
          # nothing itself — two runs left only the step below's lane comment.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.REVIEW_ARGS }}

      - name: Redact secret-shaped strings from what leaves the runner
        # A prompt injection in a reviewed diff could steer the session into
        # echoing a token into the report. The report becomes a public comment
        # and the log an artifact, so both are scrubbed of token shapes first.
        if: ${{ steps.gate.outputs.run == 'true' && !cancelled() }}
        shell: bash
        env:
          # Every secret live in this job is scrubbed by its exact value too,
          # whatever its shape.
          SCRUB_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCRUB_2: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          literal() { python3 -c 'import os,sys
          d = sys.stdin.read()
          for k in ("SCRUB_1", "SCRUB_2"):
              t = os.environ.get(k, "")
              if t:
                  d = d.replace(t, "[redacted-token]")
          sys.stdout.write(d)'; }
          scrub() { literal | sed -E 's/sk-ant-[A-Za-z0-9_-]{8,}/[redacted-token]/g; s/gh[pousr]_[A-Za-z0-9]{20,}/[redacted-token]/g; s/(ANTHROPIC_API_KEY|CLAUDE_CODE_OAUTH_TOKEN|GITHUB_TOKEN|GH_TOKEN|CODECOV_TOKEN)=[^ "]+/\1=[redacted]/g'; }
          for f in .review/*.md; do [[ -e "$f" ]] && { scrub < "$f" > "$f.tmp" && mv "$f.tmp" "$f"; }; done
          if [[ -f "$SESSION_LOG" ]]; then
            scrub < "$SESSION_LOG" > review-session.json
          else
            echo "::warning::No session log at $SESSION_LOG — the pinned action may write it elsewhere now; re-check SESSION_LOG."
          fi
          echo "redaction pass done"

      - name: Keep the session log for diagnosis
        if: ${{ steps.gate.outputs.run == 'true' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: review-session-${{ matrix.reviewer }}
          path: review-session.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Post the report and fail on criticals
        # Runs even when the reviewer step failed, so a failed round still leaves
        # its report beside the red check.
        if: ${{ steps.gate.outputs.run == 'true' && !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          AGENT: ${{ matrix.agent }}
          REVIEWER: ${{ matrix.reviewer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRUSTED: ${{ steps.trusted.outcome }}
        run: |
          set -euo pipefail
          report=$(ls -t .review/"$AGENT"-*.md 2>/dev/null | head -n 1 || true)
          MARKER="<!-- review:$REVIEWER -->"
          if [[ -z "$report" ]]; then
            last=$(jq -r 'if type=="array" then .[] else . end | select(.type=="result") | .result // empty' \
              review-session.json 2>/dev/null | tail -c 1500 || true)
            why="the stop reason is unavailable"
            # This step holds a token: the helper runs only as the base branch's copy.
            if [[ "$TRUSTED" == "success" ]]; then
              why=$(python3 -I scripts/review-stop-reason.py review-session.json 2>/dev/null || echo "$why")
            fi
            body=$(printf '%s\n## reviewer-%s — no report\n\nThe reviewer produced no report in two tries ([run](%s)); the check fails until it does. On the second try %s.\n\nSession said:\n\n> %s\n' \
              "$MARKER" "$REVIEWER" "$RUN_URL" "$why" "${last:-(no final message)}")
            criticals=1
          else
            # A failure of the helper fails this step, so a report it cannot read never
            # goes green. `-I`: the rest of `scripts/` is the pull request's, and Python
            # would otherwise import from it, beside the token.
            # If the trusted step failed, the helper may be the pull request's: fail.
            # The grep is for the pull request that adds the helper only.
            if [[ "$TRUSTED" != "success" ]]; then
              criticals=1
            elif [[ -f scripts/review-criticals.py ]]; then
              criticals=$(python3 -I scripts/review-criticals.py "$report")
            else
              criticals=$( { grep -Eo '(🔴 |Review complete: )[0-9]+ critical' "$report" || true; } | grep -Eo '[0-9]+' | head -n 1 || true)
              criticals=${criticals:-0}
            fi
            # GitHub caps a comment at 65 536 characters; keep the head of a long report.
            body=$(printf '%s\n%s\n\n[run](%s)\n' "$MARKER" "$(head -c 60000 "$report")" "$RUN_URL")
          fi
          # One comment per round, never an edit of the last (FLOW-058): each round's report is kept.
          gh pr comment "$PR_NUMBER" --body "$body"
          if [[ "$criticals" != "0" ]]; then
            if [[ "$REVIEW_BLOCKING" == "true" ]]; then
              echo "::error::reviewer-$REVIEWER reported $criticals critical finding(s) — see the PR comment."
              exit 1
            fi
            echo "::warning::reviewer-$REVIEWER reported $criticals critical finding(s) — see the PR comment (advisory: REVIEW_BLOCKING is off)."
          fi
          echo "reviewer-$REVIEWER: no critical"
