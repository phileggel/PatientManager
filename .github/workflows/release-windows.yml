name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-windows-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so `git merge-base --is-ancestor` in the "Verify tag
          # is on main" step can traverse parents; depth-1 silently misclassifies
          # any tag not literally at main's tip.
          fetch-depth: 0

      - name: Verify tag is on main
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main \
            || { echo "Tag is not on main branch — aborting release"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1
        with:
          workspaces: src-tauri
          prefix-key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Clear stale WiX artifacts
        shell: powershell
        run: Remove-Item -Recurse -Force "src-tauri\target\x86_64-pc-windows-msvc\release\wix" -ErrorAction SilentlyContinue

      - name: Install frontend dependencies
        shell: bash
        run: npm ci

      - name: Derive product name
        # Single source of truth: tauri.conf.json productName is the canonical
        # Tauri display name (installer title, window title, bundle metadata).
        # Reading it here keeps this workflow portable verbatim across projects.
        # jq is pre-installed on windows-latest runners.
        # -e exits non-zero if productName is null/missing — fail-fast over
        # silently releasing "null v1.2.3".
        shell: bash
        run: |
          name=$(jq -er .productName src-tauri/tauri.conf.json) \
            || { echo "::error::productName missing in src-tauri/tauri.conf.json"; exit 1; }
          echo "PRODUCT_NAME=$name" >> "$GITHUB_ENV"

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SQLX_OFFLINE: true
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: "-C debuginfo=0"
        with:
          tauriScript: npm run tauri
          args: --target x86_64-pc-windows-msvc
          tagName: ${{ github.ref_name }}
          releaseName: "${{ env.PRODUCT_NAME }} ${{ github.ref_name }}"
          releaseBody: "See the release assets to download and install this version."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Verify updater manifest published
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for release assets to be available..."
          for i in 1 2 3; do
            sleep 10
            STATUS=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets --jq '[.assets[].name] | map(select(test("latest\\.json"))) | length')
            if [ "$STATUS" -gt 0 ]; then
              echo "✓ latest.json found in release assets"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "Attempt $i: latest.json not yet available, retrying..."
            fi
          done
          echo "::error::latest.json was not found in release assets after 3 attempts — updater endpoint may be broken"
          exit 1

      - name: Clear Rust cache on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh cache delete --pattern "windows-rust-" --repo ${{ github.repository }} || true
