name: Codec Gate

# IFC-042 — Dedicated CI job for the import-codec dev tooling. Runs the
# fixture regenerator with the `dev-fixtures` Cargo feature, asserts no
# working-tree drift on tests/fixtures/ (IFC-041), and runs the round-trip
# integration test suite (IFC-051). The standard `quality.yml` `backend` job runs
# without this feature so contributors who do not work on the codec are not
# slowed by fixture regeneration during normal development.

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/dev/generate_fixtures.rs"
      - "src-tauri/dev/fixtures_excel/**"
      - "src-tauri/dev/fixtures_fund_pdf/**"
      - "src-tauri/dev/fixtures_bank_pdf/**"
      - "src-tauri/src/use_cases/excel_import/**"
      - "src-tauri/src/use_cases/fund_payment_reconciliation/**"
      - "src-tauri/src/use_cases/bank_statement_reconciliation/**"
      - "src-tauri/tests/codec_round_trip.rs"
      - "src-tauri/tests/codec_round_trip_fund_pdf.rs"
      - "src-tauri/tests/codec_round_trip_bank_pdf.rs"
      - "src-tauri/tests/common/**"
      - "src-tauri/tests/fixtures/**"
      - ".github/workflows/codec-gate.yml"
      - "justfile"
  push:
    branches: [main]
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/dev/generate_fixtures.rs"
      - "src-tauri/dev/fixtures_excel/**"
      - "src-tauri/dev/fixtures_fund_pdf/**"
      - "src-tauri/dev/fixtures_bank_pdf/**"
      - "src-tauri/src/use_cases/excel_import/**"
      - "src-tauri/src/use_cases/fund_payment_reconciliation/**"
      - "src-tauri/src/use_cases/bank_statement_reconciliation/**"
      - "src-tauri/tests/codec_round_trip.rs"
      - "src-tauri/tests/codec_round_trip_fund_pdf.rs"
      - "src-tauri/tests/codec_round_trip_bank_pdf.rs"
      - "src-tauri/tests/common/**"
      - "src-tauri/tests/fixtures/**"
      - ".github/workflows/codec-gate.yml"
      - "justfile"

concurrency:
  group: codec-gate-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  fixtures:
    name: Codec — regen, drift, round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1
        with:
          workspaces: src-tauri
          prefix-key: ci-codec-gate
      - name: Regenerate fixtures (excel)
        working-directory: src-tauri
        run: cargo run --features dev-fixtures --bin generate_fixtures -- excel
      - name: Regenerate fixtures (fund-pdf)
        working-directory: src-tauri
        run: cargo run --features dev-fixtures --bin generate_fixtures -- fund-pdf
      - name: Regenerate fixtures (bank-pdf)
        working-directory: src-tauri
        run: cargo run --features dev-fixtures --bin generate_fixtures -- bank-pdf
      # IFC-041 — drift check.
      # The exclude pathspec skips PDF binaries: printpdf 0.9 emits a fresh
      # `/ID` array on every save (random per-run), so byte-for-byte equality
      # is impossible for any PDF surface. The round-trip tests below are the
      # real correctness gate; this drift check still catches drift on the
      # `.expected.json` snapshots and any deterministic surface (excel).
      # The pathspec is scoped to the fixture directory so a future
      # deterministic `.pdf` committed elsewhere is still drift-checked.
      - name: Drift check (IFC-041)
        run: git diff --exit-code -- src-tauri/tests/fixtures/ ':(exclude,glob)src-tauri/tests/fixtures/**/*.pdf'
      - name: Round-trip tests (IFC-051)
        working-directory: src-tauri
        run: cargo test --features dev-fixtures --test codec_round_trip --test codec_round_trip_fund_pdf --test codec_round_trip_bank_pdf
