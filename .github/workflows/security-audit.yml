name: Security Audit

on:
  schedule:
    - cron: "0 8 * * 1" # every Monday at 08:00 UTC
  workflow_dispatch: # allow manual trigger

concurrency:
  group: security-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Run npm audit
        shell: bash
        # --audit-level=moderate: fail on moderate, high, and critical CVEs.
        # Low-severity issues are informational only and do not block.
        # --omit=dev: skip devDependencies — Tauri ships no devDeps in the
        # production bundle, so dev-only advisories are not release blockers.
        # CI/dev exposure is tracked separately.
        # No `npm ci` needed — `npm audit` reads package-lock.json directly.
        run: npm audit --audit-level=moderate --omit=dev

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        # Pinned to full SHA for v2.75.30 — mutable tags are a supply-chain risk
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1
        with:
          tool: cargo-audit

      - name: Run cargo audit
        shell: bash
        working-directory: src-tauri
        run: cargo audit
