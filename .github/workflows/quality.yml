name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Manual trigger: `gh workflow run Quality --ref <branch>` or via Actions tab.
  # Useful when GH Actions silently drops a pull_request synchronize/reopen
  # event (rare but happens on rebases).
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    name: PR checks (commit-msg hygiene + repo invariants)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate every commit in the PR
        run: |
          set -u
          BASE=$(git merge-base HEAD origin/main)
          FAIL=0
          REGEX='^(feat|fix|docs|test|chore|refactor|ci)(\([^)]+\))?!?: .+'
          # --no-merges skips the synthetic merge commit GitHub creates at
          # HEAD for pull_request events (it represents "what main looks
          # like if this PR merged" — not a real PR commit).
          for sha in $(git rev-list --no-merges "$BASE..HEAD"); do
            TITLE=$(git log -1 --pretty=%s "$sha")
            # `just merge` folds a `fixup! <title>` commit into <title>; check the title it names.
            TITLE="${TITLE#fixup! }"
            BODY=$(git log -1 --pretty=%b "$sha")
            AUTHOR_EMAIL=$(git log -1 --pretty=%ae "$sha")

            # Conventional-commit format is load-bearing for release.py
            # changelog parsing — enforced for every author, including bots.
            if ! echo "$TITLE" | grep -E "$REGEX" >/dev/null; then
              echo "::error::$sha — invalid conventional format: $TITLE"
              FAIL=1
            fi

            # The remaining checks (title length, trailing period, body
            # length, no Co-Authored-By) are human-writing-hygiene rules.
            # Bot commits (Dependabot, Renovate) carry auto-generated
            # titles/bodies that legitimately bypass them — e.g. "across
            # N directories with M updates" titles and multi-page release
            # notes. Enforce only for human authors.
            if [[ "$AUTHOR_EMAIL" != *"[bot]@"* ]]; then
              if [ ${#TITLE} -gt 72 ]; then
                echo "::error::$sha — title > 72 chars (${#TITLE}): $TITLE"
                FAIL=1
              fi
              TRIMMED=$(echo "$TITLE" | sed 's/[[:space:]]*$//')
              if [[ "$TRIMMED" == *. ]]; then
                echo "::error::$sha — title ends with period: $TITLE"
                FAIL=1
              fi
              BODY_LINES=$(echo "$BODY" | { grep -v '^$' || true; } | { grep -v '^BREAKING CHANGE:' || true; } | wc -l)
              if [ "$BODY_LINES" -gt 5 ]; then
                echo "::error::$sha — body > 5 lines ($BODY_LINES): $TITLE"
                FAIL=1
              fi
              if echo "$BODY" | grep -i '^Co-Authored-By:' >/dev/null; then
                echo "::error::$sha — contains Co-Authored-By trailer: $TITLE"
                FAIL=1
              fi
            fi
          done
          if [ "$FAIL" -eq 0 ]; then
            echo "✅ All commits pass the commit-msg hook rules."
          fi
          exit "$FAIL"
      - name: Assert src-tauri/src/bin/ is empty
        # Tauri's NSIS bundler walks src-tauri/src/bin/ on disk and expects
        # every entry to produce a bundled .exe — it does NOT enumerate
        # [[bin]] entries in Cargo.toml, so `required-features` gating is
        # insufficient. Only emptying src/bin/ prevents the Windows-release
        # bundling failure. Dev binaries belong in src-tauri/dev/.
        shell: bash
        run: |
          if [ -d src-tauri/src/bin ] && [ -n "$(ls -A src-tauri/src/bin/)" ]; then
            echo "::error::src-tauri/src/bin/ must be empty — Tauri's NSIS bundler walks it and fails on phantom .exe candidates. Move dev tools to src-tauri/dev/."
            exit 1
          fi
      - name: No patient data in the tree
        # scripts/privacy-check.py: SSN / IBAN with valid check digits, private
        # values handed to a log call, real data files. The PR description is
        # checked by pr-description.yml, which re-runs on every edit.
        run: python3 scripts/privacy-check.py
      - name: Architecture rules
        # scripts/arch-check.py: A1–A7; today's debt is frozen in
        # arch-allowlist.json and may only shrink.
        run: python3 scripts/arch-check.py
      - name: Unit tests of the repository scripts
        # Same command as `just test-scripts`; the merge guard in scripts/merge.py is under test.
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"

  scope:
    name: Which layers the change touches
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Which layers the change touches
        # A pull request runs a layer's tests (with coverage) only when it
        # touched that layer; docs-only runs none; tooling/workflow changes run
        # both. Lint, types and the build run on every job; a push to main
        # measures both layers.
        id: scope
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "pull_request" ]]; then
            scope=$(git diff --name-only "origin/$BASE...HEAD" | bash scripts/changed-scope.sh)
          else
            scope=both
          fi
          echo "scope=$scope"
          echo "frontend=$([[ "$scope" == frontend || "$scope" == both || "$scope" == none ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "backend=$([[ "$scope" == backend || "$scope" == both || "$scope" == none ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend — quality + coverage
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Quality checks (lint + biome + tsc + build)
        # --skip-tests: the suite runs once, under coverage, in the next step.
        run: python3 scripts/check.py --frontend --skip-tests
      - name: Tests with coverage (instrumented)
        if: needs.scope.outputs.frontend == 'true'
        run: npm run test:coverage
      - name: Upload to Codecov
        # Before the floor, so a drop still reaches Codecov's trend.
        if: needs.scope.outputs.frontend == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/frontend/lcov.info
          flags: frontend
          fail_ci_if_error: false
      - name: Coverage floor — feature code
        # coverage-gates.json: a ratchet, raised with the coverage, never lowered.
        if: needs.scope.outputs.frontend == 'true'
        run: python3 scripts/coverage-gate.py --frontend

  backend:
    name: Backend — quality + coverage
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
      # Absolute path so every step (cwd=repo root or src-tauri) resolves the
      # same DB. The SQLx prepare check (`cargo sqlx prepare --check`) needs a
      # live DB connection even in --check mode.
      DATABASE_URL: "sqlite:${{ github.workspace }}/src-tauri/.local/dev_check.sqlite"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools-preview: the profiler runtime cargo llvm-cov drives.
          components: rustfmt, clippy, llvm-tools-preview
      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1
        with:
          workspaces: src-tauri
          prefix-key: linux-rust
      - name: Cache sqlx-cli binaries
        # sqlx-cli has no prebuilt binary: install-action compiles it (~2 min).
        # It installs two programs: `sqlx` (database setup) and `cargo-sqlx`
        # (`cargo sqlx prepare --check` in check.py); both must be cached.
        id: cache-sqlx-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-0.8.6-both-${{ runner.os }}
      - name: Install sqlx-cli
        # Pinned to full SHA for v2.75.30 — mutable tags are a supply-chain risk.
        # sqlx-cli version matches `sqlx` in Cargo.lock (0.8.6).
        if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf
        with:
          tool: sqlx-cli@0.8.6
      - name: Setup sqlx-check DB
        working-directory: src-tauri
        run: |
          mkdir -p .local
          sqlx database setup
      - name: Quality checks (sqlx + clippy + fmt)
        # --skip-tests: the suite runs once, under llvm-cov, two steps below.
        run: python3 scripts/check.py --backend --skip-tests
      - name: Install cargo-llvm-cov and just
        # Pinned to full SHA for v2.75.30 — mutable tags are a supply-chain risk
        if: needs.scope.outputs.backend == 'true'
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf
        with:
          tool: cargo-llvm-cov@0.8.7,just
      # Single source of truth: `just coverage-be` is the same recipe developers
      # run locally (--lib --tests --features dev-fixtures + the shared ignore
      # list + inline test stripping), so CI/Codecov and local coverage cannot
      # drift. The binaries are instrumented at compile time and the suite runs
      # as usual, so the run costs about the tests' own time once warm.
      - name: Tests with coverage (llvm-cov)
        if: needs.scope.outputs.backend == 'true'
        run: just coverage-be
      - name: Upload to Codecov
        # Before the floor, so a drop still reaches Codecov's trend.
        if: needs.scope.outputs.backend == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/backend/lcov.info
          flags: backend
          fail_ci_if_error: false
      - name: Coverage floor — logic code
        # coverage-gates.json: domain, services and use cases; wire adapters
        # (api.rs) do not count. A ratchet, raised with the coverage, never lowered.
        if: needs.scope.outputs.backend == 'true'
        run: python3 scripts/coverage-gate.py --backend
