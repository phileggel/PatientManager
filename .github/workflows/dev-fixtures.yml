name: Dev Fixtures

# IFC-042 — Dedicated CI job for the import-codec dev tooling. Runs the
# fixture regenerator with the `dev-fixtures` Cargo feature, asserts no
# working-tree drift on tests/fixtures/ (IFC-041), and runs the round-trip
# integration test suite (IFC-051). The standard `ci.yml` `backend` job runs
# without this feature so contributors who do not work on the codec are not
# slowed by fixture regeneration during normal development.

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/src/bin/generate_fixtures.rs"
      - "src-tauri/src/bin/fixtures_excel/**"
      - "src-tauri/src/bin/fixtures_fund_pdf/**"
      - "src-tauri/src/use_cases/excel_import/**"
      - "src-tauri/src/use_cases/fund_payment_reconciliation/**"
      - "src-tauri/tests/codec_round_trip.rs"
      - "src-tauri/tests/codec_round_trip_fund_pdf.rs"
      - "src-tauri/tests/common/**"
      - "src-tauri/tests/fixtures/**"
      - ".github/workflows/dev-fixtures.yml"
      - "justfile"
  push:
    branches: [main]
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/src/bin/generate_fixtures.rs"
      - "src-tauri/src/bin/fixtures_excel/**"
      - "src-tauri/src/bin/fixtures_fund_pdf/**"
      - "src-tauri/src/use_cases/excel_import/**"
      - "src-tauri/src/use_cases/fund_payment_reconciliation/**"
      - "src-tauri/tests/codec_round_trip.rs"
      - "src-tauri/tests/codec_round_trip_fund_pdf.rs"
      - "src-tauri/tests/common/**"
      - "src-tauri/tests/fixtures/**"
      - ".github/workflows/dev-fixtures.yml"
      - "justfile"

concurrency:
  group: dev-fixtures-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  fixtures:
    name: Codec — regen, drift, round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: ci-dev-fixtures
      - name: Regenerate fixtures (excel)
        working-directory: src-tauri
        run: cargo run --features dev-fixtures --bin generate_fixtures -- excel
      - name: Regenerate fixtures (fund-pdf)
        working-directory: src-tauri
        run: cargo run --features dev-fixtures --bin generate_fixtures -- fund-pdf
      # IFC-041 — drift check.
      # The exclude pathspec skips fund-PDF binaries: printpdf 0.9 emits a fresh
      # `/ID` array on every save (random per-run), so byte-for-byte equality
      # is impossible for the PDF surface. The round-trip test below is the
      # real correctness gate; this drift check still catches drift on the
      # `.expected.json` snapshots and any deterministic surface (excel).
      # The pathspec is scoped to the fixture directory so a future
      # deterministic `.pdf` committed elsewhere is still drift-checked.
      - name: Drift check (IFC-041)
        run: git diff --exit-code -- src-tauri/tests/fixtures/ ':(exclude)src-tauri/tests/fixtures/**/*.pdf'
      - name: Round-trip tests (IFC-051)
        working-directory: src-tauri
        run: cargo test --features dev-fixtures --test codec_round_trip --test codec_round_trip_fund_pdf
