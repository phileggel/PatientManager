name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title (conventional commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      # Pinned to full SHA for v6.1.1 — mutable tags are a supply-chain risk.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci

  commits:
    name: Commit messages (mirrors commit-msg hook)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Validate every commit in the PR
        run: |
          set -u
          BASE=$(git merge-base HEAD origin/main)
          FAIL=0
          REGEX='^(feat|fix|docs|test|chore|refactor|ci)(\([^)]+\))?!?: .+'
          # --no-merges skips the synthetic merge commit GitHub creates at
          # HEAD for pull_request events (it represents "what main looks
          # like if this PR merged" — not a real PR commit).
          for sha in $(git rev-list --no-merges "$BASE..HEAD"); do
            TITLE=$(git log -1 --pretty=%s "$sha")
            BODY=$(git log -1 --pretty=%b "$sha")
            AUTHOR_EMAIL=$(git log -1 --pretty=%ae "$sha")

            # Conventional-commit format is load-bearing for release.py
            # changelog parsing — enforced for every author, including bots.
            if ! echo "$TITLE" | grep -E "$REGEX" >/dev/null; then
              echo "::error::$sha — invalid conventional format: $TITLE"
              FAIL=1
            fi

            # The remaining checks (title length, trailing period, body
            # length, no Co-Authored-By) are human-writing-hygiene rules.
            # Bot commits (Dependabot, Renovate) carry auto-generated
            # titles/bodies that legitimately bypass them — e.g. "across
            # N directories with M updates" titles and multi-page release
            # notes. Enforce only for human authors.
            if [[ "$AUTHOR_EMAIL" != *"[bot]@"* ]]; then
              if [ ${#TITLE} -gt 72 ]; then
                echo "::error::$sha — title > 72 chars (${#TITLE}): $TITLE"
                FAIL=1
              fi
              TRIMMED=$(echo "$TITLE" | sed 's/[[:space:]]*$//')
              if [[ "$TRIMMED" == *. ]]; then
                echo "::error::$sha — title ends with period: $TITLE"
                FAIL=1
              fi
              BODY_LINES=$(echo "$BODY" | { grep -v '^$' || true; } | { grep -v '^BREAKING CHANGE:' || true; } | wc -l)
              if [ "$BODY_LINES" -gt 5 ]; then
                echo "::error::$sha — body > 5 lines ($BODY_LINES): $TITLE"
                FAIL=1
              fi
              if echo "$BODY" | grep -i '^Co-Authored-By:' >/dev/null; then
                echo "::error::$sha — contains Co-Authored-By trailer: $TITLE"
                FAIL=1
              fi
            fi
          done
          if [ "$FAIL" -eq 0 ]; then
            echo "✅ All commits pass the commit-msg hook rules."
          fi
          exit "$FAIL"

  frontend:
    name: Frontend — quality (check.py --frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Quality checks
        run: python3 scripts/check.py --frontend
      - name: Tests with coverage (instrumented)
        run: npm run test:coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/frontend/lcov.info
          flags: frontend
          fail_ci_if_error: false

  backend:
    name: Backend — quality (check.py --backend) + coverage on merge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1
        with:
          workspaces: src-tauri
          prefix-key: linux-rust
      - name: Install sqlx-cli
        # Pinned to full SHA for v2.75.30 — mutable tags are a supply-chain risk
        uses: taiki-e/install-action@b550161ef8a7bc4f2a671c0b03a18ac9ccedea1e
        with:
          tool: sqlx-cli
      - name: Quality checks
        run: python3 scripts/check.py --backend
      - name: Install cargo-tarpaulin
        if: github.event_name == 'push'
        # Pinned to full SHA for v2.75.30 — mutable tags are a supply-chain risk
        uses: taiki-e/install-action@b550161ef8a7bc4f2a671c0b03a18ac9ccedea1e
        with:
          tool: cargo-tarpaulin
      - name: Coverage with tarpaulin
        if: github.event_name == 'push'
        working-directory: src-tauri
        run: cargo tarpaulin --out Lcov --output-dir ../coverage/backend --lib --exclude-files "build.rs" --exclude-files "dev/generate_bindings.rs"
      - name: Upload to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/backend/lcov.info
          flags: backend
          fail_ci_if_error: false
